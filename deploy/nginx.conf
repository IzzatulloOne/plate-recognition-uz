# /etc/nginx/sites-available/anpr
# Файл подключается внутри http{}, поэтому limit_req_zone здесь допустим.

# Инференс стоит ~40 мс на десктопе и 150-250 мс на слабом vCPU. Без лимита
# один клиент в цикле займёт весь процессор и положит демо.
limit_req_zone $binary_remote_addr zone=anpr:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=anpr_conn:10m;

upstream anpr {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Фото с телефона легко весит 8-12 МБ
    client_max_body_size 20m;

    access_log /var/log/nginx/anpr.access.log;
    error_log  /var/log/nginx/anpr.error.log;

    location / {
        limit_req zone=anpr burst=10 nodelay;
        limit_conn anpr_conn 4;

        proxy_pass http://anpr;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Первый запрос после рестарта ждёт прогрева моделей
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # WebSocket живёт по другим правилам: нужен Upgrade, нельзя резать по таймауту
    # (соединение молчит между кадрами) и бессмысленно ограничивать частоту —
    # backpressure уже сделан в приложении, лишний кадр там вытесняется сам.
    location /ws/ {
        proxy_pass http://anpr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn anpr_conn 2;
    }

    # Мониторингу ключ не нужен, а лимит запросов только мешает
    location = /healthz {
        proxy_pass http://anpr;
        access_log off;
    }
}
