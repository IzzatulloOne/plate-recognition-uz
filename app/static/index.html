<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANPR UZ — демо</title>
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#252c35; --fg:#e8edf2; --muted:#8b98a5;
          --ok:#3ddc84; --warn:#ffb020; --accent:#4c9aff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; flex-wrap:wrap }
  h1 { font-size:16px; margin:0; font-weight:600 }
  .badge { font-size:12px; color:var(--muted) }
  .wrap { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; padding:16px 20px }
  @media (max-width:900px){ .wrap { grid-template-columns:1fr } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px }
  .stage { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:16/9 }
  video, canvas { position:absolute; inset:0; width:100%; height:100% ; object-fit:contain }
  button { background:var(--accent); color:#0b1017; border:0; border-radius:7px;
           padding:8px 14px; font-weight:600; cursor:pointer }
  button.sec { background:#2a323c; color:var(--fg) }
  button:disabled { opacity:.45; cursor:not-allowed }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px }
  label.file { background:#2a323c; padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:600 }
  input[type=file] { display:none }
  table { width:100%; border-collapse:collapse; font-size:13px }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line) }
  th { color:var(--muted); font-weight:500 }
  .plate { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; font-weight:700;
           letter-spacing:.5px }
  .ok { color:var(--ok) } .warn { color:var(--warn) } .muted { color:var(--muted) }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#555 }
  .dot.live { background:var(--ok); box-shadow:0 0 8px var(--ok) }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px }
  .stat { background:#11161c; border:1px solid var(--line); border-radius:8px; padding:8px 10px }
  .stat b { display:block; font-size:18px } .stat span { color:var(--muted); font-size:11px }
  .chip { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--line);
          color:var(--muted) }
  .chip.yellow { color:#ffd23d; border-color:#5d4a00 }
  .chip.green  { color:#5ce68a; border-color:#0d4a24 }
</style>
</head>
<body>
<header>
  <h1>ANPR UZ</h1>
  <span class="badge"><span id="dot" class="dot"></span> <span id="conn">не подключено</span></span>
  <span class="badge" id="modelinfo"></span>
  <span style="flex:1"></span>
  <a class="badge" href="/docs" target="_blank">OpenAPI /docs</a>
</header>

<div class="wrap">
  <div class="panel">
    <div class="row">
      <button id="btnCam">Камера + WebSocket</button>
      <button id="btnStop" class="sec" disabled>Стоп</button>
      <label class="file">Файл (кадр)<input type="file" id="fileInput" accept="image/*"></label>
      <label class="file">Видео → WS<input type="file" id="videoInput" accept="video/*"></label>
      <span class="badge" title="Верхний предел. Реальная частота = 1 / время ответа сервера:
следующий кадр уходит только после ответа на предыдущий, иначе задержка копится.">
        Лимит FPS:
        <input id="sendFps" type="number" min="1" max="60" value="30" style="width:52px">
      </span>
      <label class="badge" title="Плавно: видно живое видео 60 к/с, но рамка отстаёт на время обработки.
Точно: показывается тот кадр, по которому посчитаны рамки — они совпадают, но картинка идёт с частотой обработки.">
        <input type="checkbox" id="smooth"> плавное видео
      </label>
    </div>
    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="stats">
      <div class="stat"><b id="sFps">0</b><span>FPS обработки</span></div>
      <div class="stat"><b id="sLat">0</b><span>инференс, мс</span></div>
      <div class="stat"><b id="sRt">0</b><span>круг отправка→ответ, мс</span></div>
      <div class="stat"><b id="sDet">0</b><span>номеров в кадре</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="row"><b>Текущий кадр</b></div>
    <table id="live"><thead><tr><th>Номер</th><th>Conf</th><th>Класс</th><th>Трек</th></tr></thead>
      <tbody></tbody></table>
    <div class="row" style="margin-top:18px"><b>События</b>
      <span class="badge muted">подтверждённые (голосование по кадрам)</span></div>
    <table id="events"><thead><tr><th>Время</th><th>Номер</th><th>Голосов</th></tr></thead>
      <tbody></tbody></table>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const grab = document.createElement('canvas');
let ws = null, stream = null, timer = null, frameId = 0, lastResult = null;

// Кадр, который сейчас обрабатывается на сервере. Боксы приходят с задержкой
// 150-250 мс, и если рисовать их поверх живого <video>, машина за это время
// уезжает — рамка отстаёт, хотя номер прочитан верно. Поэтому вместе с боксами
// показываем ИМЕННО тот кадр, по которому они посчитаны.
let inFlight = null;   // ImageBitmap отправленного кадра
let sentAt = 0;        // когда отправили — чтобы не залипнуть, если ответа нет

fetch('/healthz').then(r => r.json()).then(d => {
  document.getElementById('modelinfo').textContent =
    `${d.detector} + ${d.recognizer} · heads: ${d.heads.join(', ')} · ${d.device}`;
}).catch(() => {});

function setConn(on, label) {
  document.getElementById('dot').className = 'dot' + (on ? ' live' : '');
  document.getElementById('conn').textContent = label;
}

function openWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/recognize`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setConn(true, 'WebSocket подключён');
  ws.onclose = () => setConn(false, 'соединение закрыто');
  ws.onerror = () => setConn(false, 'ошибка WebSocket');
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'result') onResult(msg);
    else if (msg.type === 'error') {
      console.warn('server:', msg.message);
      if (inFlight) { inFlight.close(); inFlight = null; }   // не залипаем на ошибке
    }
  };
  return ws;
}

function onResult(msg) {
  lastResult = msg;
  document.getElementById('sFps').textContent = (msg.fps || 0).toFixed(1);
  const rt = Date.now() - sentAt;                      // полный круг: отправка -> ответ
  document.getElementById('sRt').textContent = rt > 0 && rt < 10000 ? Math.round(rt) : '—';
  document.getElementById('sLat').textContent = Math.round(msg.server_ms || 0);
  document.getElementById('sDet').textContent = msg.plates.length;
  drawBoxes(msg);
  renderLive(msg.plates);
  (msg.events || []).forEach(addEvent);
}

function drawBoxes(msg) {
  const [w, h] = msg.frame_size;
  if (!w || !h) return;
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  // Точный режим: подкладываем кадр, по которому посчитаны боксы, — рамка всегда
  // совпадает с картинкой. Плавный: canvas остаётся прозрачным, сквозь него видно
  // живое видео 60 к/с, но рамка отстаёт на время обработки.
  if (inFlight) {
    if (!document.getElementById('smooth').checked)
      ctx.drawImage(inFlight, 0, 0, w, h);
    inFlight.close();
    inFlight = null;
  }
  ctx.lineWidth = Math.max(2, w / 480);
  ctx.font = `${Math.max(14, w / 45)}px ui-monospace, monospace`;
  for (const p of msg.plates) {
    const [x1, y1, x2, y2] = p.box;
    const col = p.valid ? '#3ddc84' : '#ffb020';
    ctx.strokeStyle = col;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${p.stable_text || p.text} ${(p.conf * 100).toFixed(0)}%`;
    const tw = ctx.measureText(label).width + 10;
    const th = Math.max(18, w / 38);
    ctx.fillStyle = col;
    ctx.fillRect(x1, Math.max(0, y1 - th), tw, th);
    ctx.fillStyle = '#0b1017';
    ctx.fillText(label, x1 + 5, Math.max(th - 5, y1 - 5));
  }
}

function renderLive(plates) {
  const tb = document.querySelector('#live tbody');
  tb.innerHTML = plates.map(p => `
    <tr>
      <td class="plate ${p.valid ? 'ok' : 'warn'}">${p.stable_text || p.text || '—'}
        ${p.color && p.color !== 'white' ? `<span class="chip ${p.color}">${p.color}</span>` : ''}
        ${p.corrected ? '<span class="chip">fix</span>' : ''}</td>
      <td>${(p.conf * 100).toFixed(0)}%</td>
      <td class="muted">${p.plate_class}</td>
      <td class="muted">#${p.track_id ?? '—'} ×${p.votes}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="muted">номеров нет</td></tr>';
}

function addEvent(ev) {
  const tb = document.querySelector('#events tbody');
  const tr = document.createElement('tr');
  const t = new Date(ev.ts * 1000).toLocaleTimeString();
  tr.innerHTML = `<td class="muted">${t}</td>
                  <td class="plate ok">${ev.pretty || ev.text}</td>
                  <td class="muted">${ev.votes}</td>`;
  tb.prepend(tr);
  while (tb.children.length > 40) tb.lastChild.remove();
}

function startSending(source) {
  const fps = Math.min(30, Math.max(1, +document.getElementById('sendFps').value || 8));
  clearInterval(timer);
  timer = setInterval(() => {
    if (!ws || ws.readyState !== 1) return;
    if (source.readyState !== undefined && source.readyState < 2) return;
    // один кадр в полёте: следующий уходит только после ответа. Иначе клиент
    // шлёт быстрее, чем сервер считает, и отставание картинки копится.
    // 2 секунды — страховка на случай, если ответ потерялся.
    if (inFlight && Date.now() - sentAt < 2000) return;
    const vw = source.videoWidth, vh = source.videoHeight;
    if (!vw || !vh) return;
    grab.width = vw; grab.height = vh;
    grab.getContext('2d').drawImage(source, 0, 0, vw, vh);
    if (inFlight) inFlight.close();
    createImageBitmap(grab).then(bmp => { inFlight = bmp; sentAt = Date.now(); });
    grab.toBlob(b => {
      if (b && ws && ws.readyState === 1) b.arrayBuffer().then(buf => ws.send(buf));
    }, 'image/jpeg', 0.7);
    frameId++;
  }, 1000 / fps);
}

document.getElementById('btnCam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  } catch (e) { alert('нет доступа к камере: ' + e.message); return; }
  video.srcObject = stream; video.src = '';
  await video.play();
  openWs();
  startSending(video);
  document.getElementById('btnCam').disabled = true;
  document.getElementById('btnStop').disabled = false;
};

document.getElementById('videoInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  video.src = URL.createObjectURL(f);
  video.loop = true;
  await video.play();
  if (!ws || ws.readyState !== 1) openWs();
  startSending(video);
  document.getElementById('btnStop').disabled = false;
};

document.getElementById('btnStop').onclick = () => {
  clearInterval(timer); timer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.pause();
  if (inFlight) { inFlight.close(); inFlight = null; }
  if (ws) { ws.close(); ws = null; }
  document.getElementById('btnCam').disabled = false;
  document.getElementById('btnStop').disabled = true;
};

document.getElementById('fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/v1/recognize', { method: 'POST', body: fd });
  const d = await r.json();
  const img = new Image();
  img.onload = () => {
    video.pause(); video.srcObject = null; video.src = '';
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    drawBoxesOnImage(img, d);
  };
  img.src = URL.createObjectURL(f);
  document.getElementById('sLat').textContent = Math.round(d.timings.total_ms);
  document.getElementById('sDet').textContent = d.plates.length;
  renderLive(d.plates);
};

function drawBoxesOnImage(img, d) {
  ctx.lineWidth = Math.max(2, img.width / 480);
  ctx.font = `${Math.max(14, img.width / 45)}px ui-monospace, monospace`;
  for (const p of d.plates) {
    const [x1, y1, x2, y2] = p.box;
    const col = p.valid ? '#3ddc84' : '#ffb020';
    ctx.strokeStyle = col; ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = `${p.text} ${(p.conf * 100).toFixed(0)}%`;
    const th = Math.max(18, img.width / 38);
    ctx.fillStyle = col; ctx.fillRect(x1, Math.max(0, y1 - th),
                                      ctx.measureText(label).width + 10, th);
    ctx.fillStyle = '#0b1017'; ctx.fillText(label, x1 + 5, Math.max(th - 5, y1 - 5));
  }
}
</script>
</body>
</html>
